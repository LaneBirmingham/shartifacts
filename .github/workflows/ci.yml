name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -timeout 20m ./...
      - run: go build -trimpath -o bin/shartifacts .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose files
        run: |
          docker compose config -q
          COMPOSE_FILE=compose.yaml:deploy/caddy/compose.yaml docker compose config -q
          CLOUDFLARE_TUNNEL_TOKEN=x COMPOSE_FILE=compose.yaml:deploy/cloudflare-tunnel/compose.yaml docker compose config -q
      - name: Build both images
        run: docker compose build
