<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1b19" media="(prefers-color-scheme: dark)" />
    <title>shartifacts</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/design-system.css" />
    <link rel="stylesheet" href="/view.css" />
    <link rel="stylesheet" href="/dark.css" />
    <script src="/theme.js"></script>
    <script src="/bridge.js" defer></script>
    <script src="/icons.js" defer></script>
    <script src="/view.js" defer></script>
  </head>
  <body>
    <header class="view-bar">
      <a class="view-home" href="/artifacts" aria-label="shartifacts library">✳</a>
      <strong id="view-title">Loading…</strong>
      <span id="view-version"></span>
      <a id="view-edit" class="view-link" href="/">Open in workspace ↗</a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch theme"></button>
    </header>
    <iframe
      id="preview"
      sandbox="allow-scripts allow-forms allow-modals allow-downloads allow-popups allow-popups-to-escape-sandbox allow-pointer-lock"
      allow="fullscreen *; clipboard-write *; camera *; microphone *; geolocation *; display-capture *"
      title="Artifact"
      referrerpolicy="no-referrer"
    ></iframe>
  </body>
</html>
